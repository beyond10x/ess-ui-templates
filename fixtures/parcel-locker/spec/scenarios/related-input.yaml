type: ess-scenario/1
domain: parcels.locker
scenario: related-input
summary: A closed-locker refusal guarded on the input as well is taken only when that input guard holds, so a staff parcel and any other parcel are refused differently.

arrange:
  - instance: locker
    entity: parcels.locker.Locker

timeline:
  - at: 2026-09-30T10:00:00Z
    command: parcels.locker.InstallLocker
    actor: parcels.locker.Courier
    input: {site: Harbour}
    outcome: installed
    capture: {instance: locker, event: parcels.locker.LockerInstalled, field: locker_id}

  - at: 2026-09-30T10:00:01Z
    command: parcels.locker.ReserveParcel
    actor: parcels.locker.Courier
    input: {parcel_code: PX-70, locker_id: {$instance: locker}, recipient: Ada}
    outcome: reserved

  - at: 2026-09-30T10:00:02Z
    command: parcels.locker.CloseLocker
    actor: parcels.locker.Courier
    input: {locker_id: {$instance: locker}}
    outcome: closed

  - at: 2026-09-30T10:00:03Z
    command: parcels.locker.ReserveParcel
    actor: parcels.locker.Courier
    input: {parcel_code: PX-71, locker_id: {$instance: locker}, recipient: Ada}
    outcome: locker-closed

  - at: 2026-09-30T10:00:04Z
    command: parcels.locker.ReserveParcel
    actor: parcels.locker.Courier
    input: {parcel_code: PX-72, locker_id: {$instance: locker}, recipient: staff}
    outcome: staff-closed

assert:
  - view: parcels.locker.Parcels
    contains: {parcel_code: PX-70, recipient: Ada}
