type: ess-scenario/1
domain: parcels.locker
scenario: adv-two-accepting
summary: On an open locker two accepting when-branches of RushParcel hold for a vip; ESS's synthesis selects neither, so the step is left open.

arrange:
  - instance: locker
    entity: parcels.locker.Locker

timeline:
  - at: 2026-09-30T13:00:00Z
    command: parcels.locker.InstallLocker
    actor: parcels.locker.Courier
    input: {site: Harbour}
    outcome: installed
    capture: {instance: locker, event: parcels.locker.LockerInstalled, field: locker_id}

  - at: 2026-09-30T13:00:01Z
    command: parcels.locker.RushParcel
    actor: parcels.locker.Courier
    input: {parcel_code: PX-95, locker_id: {$instance: locker}, recipient: vip}
    outcome: rush-a
